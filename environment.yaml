name: muse-dev
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ---- core runtime ----
  - python=3.10
  - pip=26.0.1

  # ---- GPU / PyTorch ----
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - torchaudio=2.4.1
  - torchvision

  # ---- MUSE / single-cell core ----
  - scanpy=1.9.8
  - anndata=0.9.2
  - mudata=0.2.3
  - muon=0.1.7
  - numpy-base=1.24.3
  - scipy=1.10.1
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - numba=0.58.1
  - networkx=3.1
  - pynndescent=0.5.13
  - igraph=0.10.3
  - python-igraph=0.10.4
  - leidenalg=0.9.1

  # ---- plotting / notebook ----
  - matplotlib=3.7.3
  - seaborn=0.13.2
  - ipython=8.12.2
  - ipykernel=6.29.5
  - jupyter_client=8.6.3
  - jupyter_core=5.7.2

  # ---- bio / genomics utils ----
  - biopython=1.83

  # ---- genomics tools (move from pip -> conda) ----
  - zlib
  - bioconda::bedtools
  - bioconda::pybedtools

  # ---- R bridge ----
  - r-base=4.2.3
  - rpy2=3.5.11

  # ---- other basics ----
