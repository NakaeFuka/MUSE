name: muse-dev
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda

dependencies:
  # ---- core runtime ----
  - python=3.8.18
  - pip=24.3.1

  # ---- GPU / PyTorch (build string pinned) ----
  - pytorch=2.4.1=py3.8_cuda12.1_cudnn9.1.0_0
  - pytorch-cuda=12.1

  # ---- MUSE / single-cell core ----
  - scanpy=1.9.8
  - anndata=0.9.2
  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - numba=0.58.1
  - networkx=3.1
  - pynndescent=0.5.13
  - igraph=0.10.3
  - python-igraph=0.10.4
  - leidenalg=0.9.1
  - h5py=3.11.0
  - blas=*=mkl
  - mkl=2022.1.0

  # ---- plotting ----
  - matplotlib-base=3.7.3
  - seaborn=0.13.2

  # ---- genomics tools ----
  - bioconda::bedtools=2.31.1
  - bioconda::pybedtools=0.10.0

  # ---- other basics ----
  - pyyaml=6.0.2
  - requests=2.32.3
  - tqdm=4.67.1
  - joblib=1.4.2
  - pooch=1.8.2
  - filelock=3.16.1
  - platformdirs=4.3.6
  - certifi=2024.8.30

  - pip:
      - museclue==0.1.2
      - pytorch-ignite==0.5.2
      - dill==0.4.0
      - tensorboardx==2.6.2.2
      - pynvml==11.5.3
      - parse==1.20.2
      - sparse==0.15.5
      - umap-learn==0.5.7
      - statsmodels==0.14.1
      - session-info==1.0.0

      # for running the notebooks
      - ipykernel==6.29.5
      - ipython==8.12.3
      - jupyter-client==8.6.3
      - jupyter-core==5.8.1
